# Target object classes (D-070). Keys are exact COCO class names (the detector vocabulary).
# Placeholder shapes at about real size; realistic models come with the YOLO switch.
#   shape: box (size [x, y, z]) | cylinder (radius, length) | sphere (radius)
#   color: RGB 0-1 (distinct per class, for humans; the oracle detector ignores appearance)
classes:
  banana:     {shape: box,      size: [0.18, 0.04, 0.04],    color: [0.95, 0.85, 0.20]}
  apple:      {shape: sphere,   radius: 0.04,                color: [0.80, 0.10, 0.10]}
  sandwich:   {shape: box,      size: [0.12, 0.12, 0.05],    color: [0.85, 0.70, 0.45]}
  bottle:     {shape: cylinder, radius: 0.035, length: 0.25, color: [0.20, 0.50, 0.85]}
  cup:        {shape: cylinder, radius: 0.045, length: 0.10, color: [0.95, 0.95, 0.95]}
  book:       {shape: box,      size: [0.20, 0.15, 0.04],    color: [0.55, 0.10, 0.15]}
  laptop:     {shape: box,      size: [0.33, 0.23, 0.02],    color: [0.35, 0.35, 0.38]}
  remote:     {shape: box,      size: [0.18, 0.05, 0.025],   color: [0.08, 0.08, 0.08]}
  teddy bear: {shape: sphere,   radius: 0.12,                color: [0.55, 0.35, 0.20]}
