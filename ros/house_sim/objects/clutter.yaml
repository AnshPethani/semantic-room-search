# Clutter types (D-090): obstacles that are NOT on the map. Static placeholder shapes, all
# taller than the Waffle's lidar plane so Nav2 sees them through the obstacle layer.
#   shape: box (size [x, y, z]) | cylinder (radius, length) | sphere (radius)
types:
  box:   {shape: box,      size: [0.40, 0.40, 0.40],    color: [0.60, 0.45, 0.30]}
  bin:   {shape: cylinder, radius: 0.15, length: 0.50,  color: [0.25, 0.55, 0.30]}
  chair: {shape: box,      size: [0.45, 0.45, 0.85],    color: [0.40, 0.25, 0.15]}
