# Single source of truth for the house.
# Edit this file, then run (from the repository root):
#   python3 ros/house_sim/scripts/generate_house.py --preview
# It regenerates worlds/house.sdf, maps/house_map.{pgm,yaml} and <repo>/data/scene_graph.json
# so the Gazebo world, the Nav2 map and the scene graph always agree.
#
# Frame (D-050): the Gazebo world frame is the Nav2 map frame. Origin = bottom-left outer
# corner of the house, x to the right (east), y up (north), meters.

house:
  size: [12.0, 9.0]          # outer footprint (x, y)
  wall_thickness: 0.15
  wall_height: 2.0

# Wall center-lines. Outer walls are added automatically from house.size.
interior_walls:
  - [[3.3, 9.0], [3.3, 4.1]]    # E | B1 (top), E | LR (bottom)
  - [[0.0, 4.1], [5.1, 4.1]]    # E | K, LR | K
  - [[3.3, 6.1], [12.0, 6.1]]   # B1 | LR, B1 | B2
  - [[5.1, 4.1], [5.1, 0.0]]    # K | LR, K | D
  - [[5.1, 1.5], [8.8, 1.5]]    # LR | D
  - [[8.8, 6.1], [8.8, 0.0]]    # LR | B2, D | B2

# Doorways are gaps cut into walls. center = point on a wall center-line; the full width must
# lie on one wall segment. Door ID = d_<A>_<B> from `connects` (D-053).
# Wall pieces reach wall_thickness/2 into each gap, so the clear opening is width - 0.15 m.
# TurtleBot3 Waffle is ~0.31 m wide, so 1.0 m leaves room for costmap inflation.
# Doors to "outside" are generated CLOSED: a solid panel in Gazebo, occupied on the map (D-052).
doors:
  - {connects: [E, LR],      center: [3.3, 5.1],  width: 1.0}
  - {connects: [E, K],       center: [1.7, 4.1],  width: 1.0}
  - {connects: [K, LR],      center: [5.1, 2.8],  width: 1.0}
  - {connects: [LR, D],      center: [6.95, 1.5], width: 1.4}
  - {connects: [LR, B1],     center: [6.1, 6.1],  width: 1.0}
  - {connects: [LR, B2],     center: [8.8, 3.5],  width: 1.0}
  - {connects: [E, outside], center: [1.8, 9.0],  width: 1.0}   # exterior door, closed

# Rooms (D-001) as counter-clockwise polygons on wall center-lines, axis-aligned edges only
# (D-051). Floor tiles for Gazebo are derived from the polygons.
# color = floor tint in Gazebo (visual only), RGB 0-1.
rooms:
  - id: E
    name: entry hall
    polygon: [[0.0, 4.1], [3.3, 4.1], [3.3, 9.0], [0.0, 9.0]]
    color: [0.80, 0.84, 0.95]
  - id: K
    name: kitchen
    polygon: [[0.0, 0.0], [5.1, 0.0], [5.1, 4.1], [0.0, 4.1]]
    color: [0.95, 0.82, 0.80]
  - id: LR
    name: living room           # L shape: K cuts into its lower-left corner
    polygon: [[5.1, 1.5], [8.8, 1.5], [8.8, 6.1], [3.3, 6.1], [3.3, 4.1], [5.1, 4.1]]
    color: [0.82, 0.93, 0.80]
  - id: D
    name: dining area
    polygon: [[5.1, 0.0], [8.8, 0.0], [8.8, 1.5], [5.1, 1.5]]
    color: [0.96, 0.88, 0.74]
  - id: B1
    name: bedroom 1
    polygon: [[3.3, 6.1], [12.0, 6.1], [12.0, 9.0], [3.3, 9.0]]
    color: [0.88, 0.82, 0.95]
  - id: B2
    name: bedroom 2
    polygon: [[8.8, 0.0], [12.0, 0.0], [12.0, 6.1], [8.8, 6.1]]
    color: [0.88, 0.82, 0.95]

robot_start: {x: 1.65, y: 7.5, yaw: 0.0}   # inside the entry hall E

# Search viewpoints (D-080, D-081), written to the scene graph. The robot turns 360 deg at each
# one; the camera is assumed to detect objects up to camera_range meters away in line of sight.
viewpoints:
  camera_range: 3.0      # m, detection range assumed for the RGB-D camera (tunable)
  wall_clearance: 0.5    # m from wall surfaces, room to turn in place
  max_per_room: 3        # proposal: 1-3 viewpoints per room
  candidate_grid: 0.25   # m, spacing of candidate viewpoints
  target_grid: 0.2       # m, spacing of floor samples that must be seen

map:
  resolution: 0.05     # m / pixel
  margin: 0.5          # unknown border around the house; map yaml origin = [-margin, -margin, 0]
